<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pages légales des applications</title>
<meta name="description" content="Politiques de confidentialité des applications de clubs éditées par ISO-BEN SRL.">
<style>
  :root{--ink:#14161a;--body:#3d434d;--muted:#6b7280;--line:#e6e8ec;--bg:#fff;--accent:#1d3f73}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --ink:#f2f4f7;--body:#c7ccd4;--muted:#8b93a0;--line:#262a31;--bg:#111317;--accent:#9ab6e6}}
  :root[data-theme="dark"]{--ink:#f2f4f7;--body:#c7ccd4;--muted:#8b93a0;--line:#262a31;--bg:#111317;--accent:#9ab6e6}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--body);
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:40rem;margin:0 auto;padding:56px 16px}
  h1{color:var(--ink);font-size:1.5rem;margin:0 0 6px}
  p{margin:0 0 22px;color:var(--muted);font-size:.93rem}
  ul{list-style:none;padding:0;margin:0}
  li{border-top:1px solid var(--line);padding:14px 0}
  a{color:var(--accent);text-decoration:none;font-weight:600}
  a:hover{text-decoration:underline}
  footer{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:.84rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>Pages légales</h1>
  <p>Politiques de confidentialité des applications de clubs éditées par ISO-BEN SRL.</p>
  <ul>
    <li><a href="sporting-bruxelles/">Sporting Bruxelles FC</a></li>
  </ul>
  <footer>ISO-BEN SRL · Rue de Lombartzyde 179, 1120 Bruxelles · BE 0500.506.439</footer>
</div>
</body>
</html>
